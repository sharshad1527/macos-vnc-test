name: RealVNC end-to-end
on: workflow_dispatch

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up RealVNC
        env:
          VNC_PASSWORD: 'FarisMac2026'
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup_realvnc.sh "$VNC_PASSWORD" 5901 2>&1 | tail -60

      - name: Pull a real framebuffer through RFB
        env:
          VNC_PASSWORD: 'FarisMac2026'
        run: |
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install --quiet vncdotool pillow
          PORT=$(cat /tmp/realvnc.port 2>/dev/null || echo 5901)
          echo "=== connecting to 127.0.0.1:$PORT ==="
          /tmp/v/bin/vncdo -s 127.0.0.1:$((PORT-5900)) -p "$VNC_PASSWORD" \
            capture /tmp/rv.png 2>&1 | tail -12 || echo "  vncdo returned non-zero"
          if [ -s /tmp/rv.png ]; then
            cp /tmp/rv.png "$RUNNER_TEMP/rvnc.png"
            /tmp/v/bin/python - <<'PY'
          from PIL import Image
          im = Image.open("/tmp/rv.png").convert("RGB"); px = list(im.getdata())
          nb = sum(1 for p in px if max(p) > 12)
          pct = 100.0*nb/len(px)
          print(f"  RESULT size={im.size} nonblack={pct:.2f}%")
          print("  VERDICT:", "REAL DESKTOP" if pct > 1.0 else "BLACK / EMPTY")
          PY
          else
            echo "  NO FRAME CAPTURED"
          fi

      - name: dump config + logs
        if: always()
        run: |
          echo "=== /var/root/.vnc/config.d/vncserver ==="
          sudo cat /var/root/.vnc/config.d/vncserver 2>/dev/null || echo "(missing)"
          echo "=== listener ==="
          sudo lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | grep -E ':59[0-9][0-9]' || echo "(none)"
          echo "=== tccd screen-capture verdicts (last 10m) ==="
          sudo log show --last 10m --style compact 2>/dev/null \
            | grep -iE 'realvnc|VNC Server' | grep -iE 'TCC|screen|deny|grant' | tail -25 || echo "(none)"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realvnc-frame
          path: ${{ runner.temp }}/rvnc.png
          if-no-files-found: ignore
