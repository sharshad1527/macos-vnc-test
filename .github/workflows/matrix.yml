name: Does an older image fix the black screen
on: workflow_dispatch

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-15', 'macos-14', 'macos-26']
    steps:
      - uses: actions/checkout@v4

      # Deliberately minimal: no brew, no tunnels, no web desktop. We only
      # want to know whether ARD will hand over the framebuffer on this image.
      - name: Enable ARD (minimal)
        run: |
          set -x
          chmod +x scripts/grant_tcc.sh
          sudo dscl . -passwd /Users/vncuser 'FarisMac2026' 2>/dev/null || true
          sudo createhomedir -c -u vncuser 2>/dev/null || true
          ./scripts/grant_tcc.sh > /tmp/tcc.log 2>&1 || true
          tail -3 /tmp/tcc.log
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$K" -activate -configure -access -on -allusers -privs -all -restart -agent -menu 2>&1 | tail -8
          sleep 5
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || echo "NO LISTENER"
          sudo dscl . -authonly vncuser 'FarisMac2026' && echo "AUTH OK" || echo "AUTH FAIL"

      - name: Capture over VNC
        env:
          VNC_PASSWORD: 'FarisMac2026'
        run: |
          set +e
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install --quiet vncdotool pillow
          /tmp/v/bin/vncdo -s 127.0.0.1:0 -u vncuser -p "$VNC_PASSWORD" \
            capture /tmp/f.png 2>&1 | tail -5
          ls -la /tmp/f.png 2>/dev/null || echo "NO FRAME FILE"
          cp -f /tmp/f.png "$RUNNER_TEMP/f.png" 2>/dev/null || true

      - name: Score
        run: |
          set +e
          python3 -m venv /tmp/s
          /tmp/s/bin/pip install --quiet pillow
          echo "IMAGE=${{ matrix.os }} $(/tmp/s/bin/python scripts/score_frame.py /tmp/f.png 2>&1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-${{ matrix.os }}
          path: ${{ runner.temp }}/f.png
          if-no-files-found: ignore
