name: macOS Cloud Desktop (VNC)

on:
  workflow_dispatch:
    inputs:
      os_runner:
        description: 'macOS Runner Version'
        required: false
        default: 'macos-latest'
        type: choice
        options:
          - 'macos-latest'
          - 'macos-14'
          - 'macos-15'
      ngrok_token:
        description: 'Ngrok Auth Token (Optional if set in Repo Secrets)'
        required: false
        default: ''
        type: string
      vnc_password:
        description: 'VNC & Admin Password'
        required: false
        default: 'FarisMac2026'
        type: string
      ngrok_region:
        description: 'Ngrok Region'
        required: false
        default: 'in'
        type: choice
        options:
          - 'in'
          - 'ap'
          - 'us'
          - 'eu'
      legacy_vnc:
        description: 'Legacy VNC (VNC4) protocol - insecure, turn OFF if your client supports Apple auth'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  macos-desktop:
    name: macOS Desktop Runner
    runs-on: ${{ github.event.inputs.os_runner || 'macos-latest' }}
    timeout-minutes: 360 # 6 hours maximum limit on GitHub Actions

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Screen Sharing & Start Tunnels
        env:
          INPUT_NGROK_TOKEN: ${{ github.event.inputs.ngrok_token }}
          SECRET_NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password || 'FarisMac2026' }}
          NGROK_REGION: ${{ github.event.inputs.ngrok_region || 'in' }}
          LEGACY_VNC: ${{ github.event.inputs.legacy_vnc || 'yes' }}
        run: |
          chmod +x scripts/setup_vnc.sh
          FINAL_TOKEN="${INPUT_NGROK_TOKEN:-$SECRET_NGROK_TOKEN}"
          ./scripts/setup_vnc.sh "$VNC_PASSWORD" "$FINAL_TOKEN" "$NGROK_REGION"

      - name: Self-test - are the pixels real?
        env:
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password || 'FarisMac2026' }}
        run: |
          set -e
          echo "Installing a RFB client to pull the framebuffer from localhost:5900..."
          # Homebrew python is externally managed (PEP 668) - use a venv.
          python3 -m venv /tmp/vncvenv
          /tmp/vncvenv/bin/pip install --quiet --disable-pip-version-check vncdotool pillow

          VNC_PASSWORD="$VNC_PASSWORD" /tmp/vncvenv/bin/vncdo \
            -s 127.0.0.1:0 -p "$VNC_PASSWORD" capture /tmp/vnc-frame.png

          /tmp/vncvenv/bin/python - <<'PY'
          import sys
          from PIL import Image

          im = Image.open("/tmp/vnc-frame.png").convert("RGB")
          px = list(im.getdata())
          nonblack = sum(1 for p in px if max(p) > 12)
          pct = 100.0 * nonblack / len(px)
          print(f"  framebuffer : {im.size[0]}x{im.size[1]}")
          print(f"  non-black   : {pct:.2f}%")
          if pct < 0.5:
              print("  RESULT: BLACK SCREEN - the framebuffer is empty.")
              sys.exit(1)
          print("  RESULT: REAL DESKTOP - the framebuffer has actual content.")
          PY

          cp /tmp/vnc-frame.png "$RUNNER_TEMP/vnc-frame.png"

      - name: Upload frame sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-frame-sample
          path: ${{ runner.temp }}/vnc-frame.png
          if-no-files-found: ignore

      - name: Health Check
        run: |
          echo "--- listener on 5900 (needs sudo: socket is root/launchd owned) ---"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || echo "NOT LISTENING"
          echo "--- Apple remote daemons ---"
          ps aux | grep -iE 'screenshar|ARDAgent|AppleVNC' | grep -v grep || echo "(no ARD/VNC process)"
          echo "--- console session owner (empty = no GUI login) ---"
          stat -f '%Su' /dev/console
          echo "--- TCC grants for screen sharing ---"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT service||' -> '||client||' auth='||auth_value||' v='||COALESCE(auth_version,'-') FROM access WHERE client LIKE '%screenshar%' OR client LIKE '%ARDAgent%';"
          echo "--- all ScreenCapture grants (sample) ---"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT client FROM access WHERE service='kTCCServiceScreenCapture' LIMIT 10;"
          echo "--- SIP ---"
          sudo csrutil status || true

      - name: Keep-Alive Loop (Up to 6 Hours)
        run: |
          echo "=========================================================="
          echo "🟢 macOS Cloud Desktop session is live and interactive!"
          echo "To stop this runner, click 'Cancel run' in GitHub Actions."
          echo "=========================================================="
          # Keepalive loop for 6 hours
          for ((i=1; i<=360; i++)); do
            sleep 60
          done
